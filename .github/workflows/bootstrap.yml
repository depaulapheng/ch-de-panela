name: Bootstrap project
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore complete project
        shell: bash
        run: |
          cat .bootstrap/part-*.txt > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.tar.gz
          tar -xzf /tmp/project.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build complete Pedro & Larissa gift registry"
          git push origin HEAD:main
