name: Bootstrap project

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/**'
      - 'bootstrap.sh'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct project
        run: bash bootstrap.sh
